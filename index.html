<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUMAN Школа - Екосистема</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-main: #141414;
            --bg-sidebar: #181818;
            --bg-card: #1c1c1c;
            --border-color: #292929;
            --text-main: #e3e3e3;
            --text-muted: #8c8c8c;
            --accent-blue: #528ccc;
            --sidebar-active: #232323;
            --dz-blue: #29b6f6;
            --dz-yellow: #ffca28;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; user-select: none; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Боковая панель */
        .sidebar { width: 64px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 15px 0; flex-shrink: 0; z-index: 10; }
        .sidebar-menu { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
        
        .profile-container { display: flex; align-items: center; justify-content: center; width: 48px; height: 44px; position: relative; margin-bottom: 5px; cursor: pointer; }
        .profile-lines { display: flex; flex-direction: column; gap: 3px; position: absolute; left: 0px; top: 16px; }
        .profile-lines span { width: 6px; height: 1.2px; background-color: #777777; border-radius: 1px; }
        .profile-lines span:nth-child(2) { width: 9px; }
        .profile-lines span:nth-child(3) { width: 7px; }
        .profile-lines span:nth-child(4) { width: 5px; }
        .profile-avatar { width: 34px; height: 34px; border-radius: 50%; background: #3a3a3a; margin-left: 12px; border: 1px solid #444; }
        
        /* Стили для кнопок меню (Сделаны блоками, чтобы кликалось идеально) */
        .menu-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; transition: background 0.2s; position: relative; }
        .menu-icon svg { width: 24px; height: 24px; display: block; }
        
        /* Цвета обводки SVG по умолчанию */
        .icon-stroke { stroke: #777777; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.2s; }
        .icon-fill { fill: #777777; transition: fill 0.2s; }
        
        /* Эффект наведения */
        .menu-icon:hover { background-color: var(--sidebar-active); }
        .menu-icon:hover .icon-stroke { stroke: #ffffff; }
        .menu-icon:hover .icon-fill { fill: #ffffff; }
        
        /* Активное состояние кнопки (Синий цвет по вашему 2 фото) */
        .menu-icon.active { background-color: var(--sidebar-active); }
        .menu-icon.active .icon-stroke { stroke: var(--accent-blue) !important; }
        .menu-icon.active .icon-fill { fill: var(--accent-blue) !important; }

        /* Главный рабочий контейнер */
        .main-container { flex-grow: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .page-content { display: none; width: 100%; height: 100%; overflow: hidden; }
        .page-content.active-view { display: flex; flex-direction: column; animation: fadeIn 0.15s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .empty-view-wrapper { flex-grow: 1; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 15px; }

        /* Хедер расписания */
        .schedule-header { height: 50px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 20px; gap: 15px; font-size: 14px; background-color: var(--bg-main); }
        .nav-arrows { display: flex; gap: 15px; font-weight: bold; cursor: pointer; color: var(--text-muted); }
        .nav-arrows span:hover { color: white; }
        .current-week-lbl { color: var(--text-main); font-weight: 500; }

        /* Сетка недели */
        .schedule-grid { flex-grow: 1; display: grid; grid-template-columns: repeat(7, 1fr); overflow: hidden; background-color: #101010; }
        .day-column { display: flex; flex-direction: column; border-right: 1px solid var(--border-color); overflow-y: auto; background-color: var(--bg-main); padding-bottom: 20px; }
        .day-column:last-child { border-right: none; }
        .day-column::-webkit-scrollbar { width: 4px; }
        .day-column::-webkit-scrollbar-thumb { background: #262626; border-radius: 2px; }
        
        .day-header { padding: 12px 8px; text-align: center; border-bottom: 1px solid var(--border-color); background-color: var(--bg-sidebar); position: sticky; top: 0; z-index: 2; margin-bottom: 4px; }
        .day-name { font-size: 13px; font-weight: 600; color: var(--text-main); }
        .day-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* Плашка Завдання */
        .dz-header-badge { display: flex; align-items: center; gap: 6px; background-color: #1a2633; border: 1px solid #243547; border-radius: 4px; margin: 4px 8px 8px 8px; padding: 6px 8px; font-size: 11px; font-weight: 600; color: #7fbaed; cursor: pointer; }
        .dz-header-badge.yellow-badge { background-color: #262015; border: 1px solid #382f1f; color: #edd27f; }
        .dz-header-badge svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
        .dz-counter { margin-left: auto; background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font-size: 10px; }

        /* Карточка урока */
        .lesson-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; margin: 0 8px 6px 8px; padding: 10px; position: relative; display: flex; flex-direction: column; gap: 3px; transition: background 0.15s; cursor: pointer; min-height: 85px; }
        .lesson-card:hover { background-color: #222222; }
        .lesson-card.has-dz-blue { border-left: 3px solid var(--dz-blue); }
        .lesson-card.has-dz-yellow { border-left: 3px solid var(--dz-yellow); }

        .lesson-title { font-size: 12px; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lesson-class { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-bottom: 2px; }
        .lesson-desc { font-size: 11px; color: var(--text-muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; font-weight: 400; }
        .lesson-footer-info { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 4px; font-size: 10px; color: var(--text-muted); }

        /* Стили оценок 11 и 10 */
        .mark-container { display: flex; align-items: center; gap: 4px; background: #262626; padding: 2px 6px; border-radius: 4px; color: #ffffff; font-weight: 600; font-size: 11px; }
        .mark-container svg { width: 11px; height: 11px; stroke: var(--text-muted); fill: none; stroke-width: 2; }
    </style>
</head>
<body>
