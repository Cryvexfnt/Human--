<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUMAN Школа - Загальна стрічка</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-main: #1e1e1e;
            --bg-sidebar: #181818;
            --border-color: #2d2d2d;
            --text-main: #e3e3e3;
            --text-muted: #888888;
            --accent-blue: #528ccc;
            --bg-dropdown: #2a2a2a;
            --sidebar-active: #282828;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Узкое оригинальное левое меню */
        .sidebar { width: 64px; background-color: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 15px 0; flex-shrink: 0; }
        .sidebar-top { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
        .sidebar-bottom { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; margin-bottom: 10px; }
        
        /* Профиль (круг сверху) */
        .profile-icon { width: 36px; height: 36px; border-radius: 50%; background-color: #333; margin-bottom: 10px; cursor: pointer; border: 1px solid #444; }
        
        /* Кнопки меню */
        .menu-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
        .menu-icon svg { width: 22px; height: 22px; fill: none; stroke: #a3a3a3; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .menu-icon:hover svg { stroke: #ffffff; }
        
        /* Активный пункт (с квадратной подложкой как на скрине) */
        .menu-icon.active { background-color: var(--sidebar-active); }
        .menu-icon.active svg { stroke: #ffffff; }

        /* Основная рабочая область */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; height: 100%; overflow-y: auto; padding: 40px 60px; }
        .page-title { font-size: 32px; font-weight: 400; margin-bottom: 15px; color: #ffffff; }
        .user-greeting { font-size: 16px; color: var(--text-muted); margin-bottom: 5px; }
        .profile-link { color: var(--accent-blue); text-decoration: none; font-size: 15px; display: inline-block; margin-bottom: 30px; }
        .profile-link:hover { text-decoration: underline; }

        /* Панель фильтрации */
        .filter-panel { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 14px; color: var(--text-muted); }
        .custom-select { background-color: var(--bg-dropdown); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; outline: none; }
    </style>
</head>
<body>

    <!-- Оригинальное левое меню HUMAN -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="profile-icon" title="Профіль"></div>
            <!-- Главная (активная, с подложкой) -->
            <div class="menu-icon active" title="Головна">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <!-- Сообщения -->
            <div class="menu-icon" title="Повідомлення">
                <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            </div>
            <!-- Уведомления -->
            <div class="menu-icon" title="Сповіщення">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </div>
        </div>
        
        <div class="sidebar-bottom">
            <!-- Календарь -->
            <div class="menu-icon" title="Календар">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
            <!-- Мои курсы (Книга) -->
            <div class="menu-icon" title="Мої курси">
                <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            </div>
            <!-- Аналитика (График) -->
            <div class="menu-icon" title="Аналітика">
                <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            </div>
            <!-- Журнал (Планшетка) -->
            <div class="menu-icon" title="Журнал">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            </div>
            <!-- Три точки -->
            <div class="menu-icon" title="Інше">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
            </div>
        </div>
    </aside>

    <!-- Главный контент страницы -->
    <main class="main-content">
        <h1 class="page-title">Загальна стрічка</h1>
        
        <div class="user-greeting">Лисянський Ярослав, перегляньте, що нового</div>
        <a href="#" class="profile-link">Мій навчальний профіль</a>

        <div class="filter-panel">
            <span>Постів на сторінці:</span>
            <select class="custom-select">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20">20</option>
            </select>
        </div>
    </main>

</body>
</html>
